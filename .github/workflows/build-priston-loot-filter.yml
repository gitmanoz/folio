name: Build Priston Loot Filter Standalone

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore source bundle
        shell: pwsh
        run: |
          $b64 = Get-Content -Raw 'priston-build/source.zip.b64'
          [IO.File]::WriteAllBytes('priston-source.zip', [Convert]::FromBase64String($b64.Trim()))
          Expand-Archive -Path 'priston-source.zip' -DestinationPath 'priston-loot-filter' -Force

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r priston-loot-filter/requirements.txt
          python -m pip install pyinstaller

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tess = 'C:\Program Files\Tesseract-OCR'
          if (!(Test-Path "$tess\tesseract.exe")) { throw 'Tesseract nao encontrado apos instalacao' }
          if (!(Test-Path "$tess\tessdata\por.traineddata")) {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/por.traineddata' -OutFile "$tess\tessdata\por.traineddata"
          }
          & "$tess\tesseract.exe" --version
          & "$tess\tesseract.exe" --list-langs

      - name: Build single-file EXE
        shell: pwsh
        working-directory: priston-loot-filter
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PristonLootFilter `
            --add-data 'data;data' `
            --add-data 'C:\Program Files\Tesseract-OCR;tesseract' `
            main.py
          if (!(Test-Path 'dist\PristonLootFilter.exe')) { throw 'EXE nao foi gerado' }
          Get-Item 'dist\PristonLootFilter.exe' | Format-List Name,Length,FullName

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: PristonLootFilter-Standalone
          path: priston-loot-filter/dist/PristonLootFilter.exe
          if-no-files-found: error
          compression-level: 0
